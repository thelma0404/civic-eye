# ------------------------------------------------------------
# Civic Eye
# ------------------------------------------------------------
spring.application.name=civic-eye
server.port=8080
# Open http://localhost:8080 in your browser automatically when the app starts (set to false to turn off)
app.open-browser=true

# ---------- MySQL ----------
# The app uses its OWN database, "civic_eye_db", which is created automatically
# on first start. Using a fresh name keeps it separate from any old tables you may have
# from earlier projects (old tables are what caused "account disabled" and sign-up errors).
# Change the username/password to match your MySQL login
# (or set the DB_USERNAME / DB_PASSWORD environment variables).
spring.datasource.url=jdbc:mysql://localhost:3306/civic_eye_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# "update" creates and updates the tables from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- File uploads ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
# Folder (relative to the project root) where complaint photos and work proofs are stored
app.upload.dir=uploads

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
