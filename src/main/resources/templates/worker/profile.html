<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · Civic Eye Worker</title>
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/worker.css">
</head>
<body class="app role-worker" data-role="worker" data-page="profile">
<aside class="sidebar" id="sidebar">
  <a class="brand" href="/worker/dashboard">
    <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
    <span><strong>Civic Eye</strong><small>Field worker</small></span>
  </a>
  <nav>
    <a class="nav-link" href="/worker/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Dashboard</span></a>
    <a class="nav-link" href="/worker/complaints"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3M3 13h18"/></svg><span>Assigned complaints</span></a>
    <a class="nav-link" href="/worker/history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Work history</span></a>
    <a class="nav-link" href="/worker/notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>Notifications</span></a>
    <a class="nav-link active" href="/worker/profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span></a>
  </nav>
  <button class="nav-link" type="button" data-logout><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 17l5-5-5-5M15 12H3"/></svg><span>Log out</span></button>
</aside>
<div class="main">
  <header class="topbar">
    <button class="menu-btn" type="button" data-menu aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <h1>Profile</h1>
    <a class="bell" href="/worker/notifications" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="badge-dot" id="notifCount" hidden></span></a>
    <div class="user-chip" id="userChip"><span class="avatar">…</span></div>
  </header>
  <main class="content">
    <div class="grid grid-2">
      <form class="card" id="profileForm" novalidate>
        <div class="card-head"><h2>Your details</h2><span class="small muted">Joined <span id="memberSince">—</span></span></div>
        <div class="field"><label for="pName">Full name</label><input id="pName" name="name" maxlength="100" data-editable required></div>
        <div class="field"><label for="pEmail">Email</label><input id="pEmail" name="email" readonly></div>
        <div class="field"><label for="pPhone">Phone</label><input id="pPhone" name="phone" type="tel" maxlength="20" data-editable></div>
        <div class="field"><label for="pDept">Department</label><input id="pDept" name="department" readonly><span class="hint">Your email and department are managed by the administrator.</span></div>
        <button class="btn" type="submit">Save changes</button>
      </form>
      <form class="card" id="passwordForm" novalidate>
        <div class="card-head"><h2>Change password</h2></div>
        <div class="field"><label for="currentPassword">Current password</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required></div>
        <div class="field"><label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="6" required></div>
        <div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required></div>
        <button class="btn btn-outline" type="submit">Update password</button>
      </form>
    </div>
  </main>
</div>
<script src="/js/common.js"></script>
<script src="/js/worker.js"></script>
</body>
</html>
